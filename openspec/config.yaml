schema: spec-driven
strict_tdd: true

context: |
  jjdlr-dots is a public, learning-oriented dotfiles project for a reproducible,
  modular, portable, and maintainable workstation environment.
  macOS is the first verified platform; Linux and Windows are future evolutions.
  chezmoi is the minimal dotfile management and application layer.
  The first planned implementation slice combines macOS, chezmoi, and Starship.
  Architecture remains a modular monolith with explicit ownership boundaries.
  The repository has documentation and a local-path safety check, but no managed
  dotfiles, dependency manifest, test runner, linter, type checker, or formatter.

testing:
  detected: 2026-07-22
  strict_tdd_source: openspec/config.yaml
  runner: not-configured
  commands: []
  layers:
    unit: unavailable
    integration: unavailable
    e2e: unavailable
  coverage:
    available: false
    command: null
  quality:
    linter: unavailable
    type_checker: unavailable
    formatter: unavailable
  repository_checks:
    - name: local-path-safety
      command: ./scripts/check-local-paths.sh
  notes: >-
    Strict TDD is an explicit project policy, but no test runner currently makes
    it executable. The first implementation proposal must select automated checks
    appropriate for chezmoi and shell configuration before implementation begins.

rules:
  init:
    - Initialize only project-level SDD context; do not create change artifacts.
  explore:
    - Keep exploration read-only and separate from proposal work.
  proposal:
    - Scope changes as small, understandable milestones, with macOS first.
    - State verification and rollback considerations for installation changes.
  specs:
    - >-
      Express behavior and acceptance criteria without prescribing hidden
      implementation details.
    - >-
      Include portability, idempotency, and secret-safety requirements where
      relevant.
  design:
    - >-
      Preserve the modular-monolith architecture and explicit module
      responsibilities.
    - >-
      Explain tool and architecture decisions so the repository remains
      educational.
  tasks:
    - Order implementation tasks test-first under strict TDD.
    - Keep the complete change reviewable within the configured 800-line budget.
    - Use one pull request by default; split only when the review budget or cohesion requires it.
  apply:
    - >-
      Write a failing test or automated check before implementation whenever
      executable behavior changes.
    - Do not broaden the macOS-first slice to Linux or Windows without an approved change.
  verify:
    - Run all configured checks and report any manual verification explicitly.
    - >-
      Verify that no credentials, machine-specific secrets, or private data
      are committed.
  archive:
    - Archive only after requirements and verification evidence are complete.
